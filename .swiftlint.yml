# SwiftLint configuration. CI runs `swiftlint lint --strict`, so every warning fails the build.
# Formatting is owned by swift-format (see .swift-format); this file covers the rest.

included:
  - DiffViewer
  - DiffViewerTests

opt_in_rules:
  - closure_spacing
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - contains_over_range_nil_comparison
  - empty_count
  - first_where
  - last_where
  - modifier_order
  - redundant_nil_coalescing
  - redundant_type_annotation
  - sorted_first_last
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - unused_optional_binding
  - yoda_condition

disabled_rules:
  # Diff sources are decoded lossily on purpose: files with invalid UTF-8 must still render.
  - optional_data_string_conversion
  # swift-format formats collections with trailing commas.
  - trailing_comma

# The diff and layout code uses short mathematical names (a, b, x, y, w1, h) by design.
identifier_name:
  min_length: 1
  max_length: 60

type_name:
  min_length: 2
  max_length: 60

line_length:
  warning: 120
  error: 200
  ignores_comments: true
  ignores_urls: true
  ignores_interpolated_strings: true

large_tuple:
  warning: 4
  error: 6

nesting:
  type_level: 2

cyclomatic_complexity:
  warning: 20
  error: 30
  ignores_case_statements: true

function_body_length:
  warning: 100
  error: 200

type_body_length:
  warning: 400
  error: 600

file_length:
  warning: 600
  error: 1000

name: DiffViewer
options:
  bundleIdPrefix: com.selwin
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  generateEmptySchemes: false
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_STRICT_CONCURRENCY: complete
    DEAD_CODE_STRIPPING: YES
packages:
  SwiftTreeSitter:
    url: https://github.com/tree-sitter/swift-tree-sitter
    from: 0.25.0
  TreeSitterSwift:
    url: https://github.com/alex-pinkus/tree-sitter-swift
    branch: with-generated-files
  TreeSitterPython:
    url: https://github.com/tree-sitter/tree-sitter-python
    exactVersion: 0.23.6
  TreeSitterJavaScript:
    url: https://github.com/tree-sitter/tree-sitter-javascript
    exactVersion: 0.23.1
  TreeSitterTypeScript:
    url: https://github.com/tree-sitter/tree-sitter-typescript
    from: 0.23.2
  TreeSitterJSON:
    url: https://github.com/tree-sitter/tree-sitter-json
    from: 0.24.8
  TreeSitterGo:
    url: https://github.com/tree-sitter/tree-sitter-go
    from: 0.25.0
  TreeSitterRust:
    url: https://github.com/tree-sitter/tree-sitter-rust
    from: 0.24.2
  TreeSitterC:
    url: https://github.com/tree-sitter/tree-sitter-c
    from: 0.24.2
  TreeSitterCPP:
    url: https://github.com/tree-sitter/tree-sitter-cpp
    from: 0.23.4
  TreeSitterHTML:
    url: https://github.com/tree-sitter/tree-sitter-html
    from: 0.23.2
  TreeSitterCSS:
    url: https://github.com/tree-sitter/tree-sitter-css
    exactVersion: 0.23.2
  TreeSitterBash:
    url: https://github.com/tree-sitter/tree-sitter-bash
    from: 0.25.1
  TreeSitterRuby:
    url: https://github.com/tree-sitter/tree-sitter-ruby
    from: 0.23.1
  TreeSitterYAML:
    url: https://github.com/tree-sitter-grammars/tree-sitter-yaml
    exactVersion: 0.7.0
  TreeSitterTOML:
    url: https://github.com/tree-sitter-grammars/tree-sitter-toml
    from: 0.7.0
  TreeSitterJava:
    url: https://github.com/tree-sitter/tree-sitter-java
    from: 0.23.5
  TreeSitterPHP:
    url: https://github.com/tree-sitter/tree-sitter-php
    from: 0.24.2
  TreeSitterMarkdown:
    url: https://github.com/tree-sitter-grammars/tree-sitter-markdown
    from: 0.5.3
  TreeSitterKotlin:
    url: https://github.com/fwcd/tree-sitter-kotlin
    exactVersion: 0.3.8
targets:
  DiffViewer:
    type: application
    platform: macOS
    sources:
      - path: DiffViewer
        excludes:
          - "Resources/bin/**"
      - path: DiffViewer/Resources/bin/difft
        buildPhase:
          copyFiles:
            destination: executables
    dependencies:
      - package: SwiftTreeSitter
      - package: TreeSitterSwift
      - package: TreeSitterPython
      - package: TreeSitterJavaScript
      - package: TreeSitterTypeScript
      - package: TreeSitterJSON
      - package: TreeSitterGo
      - package: TreeSitterRust
      - package: TreeSitterC
      - package: TreeSitterCPP
      - package: TreeSitterHTML
      - package: TreeSitterCSS
      - package: TreeSitterBash
      - package: TreeSitterRuby
      - package: TreeSitterYAML
      - package: TreeSitterTOML
      - package: TreeSitterJava
      - package: TreeSitterPHP
        product: TreeSitterPHP
      - package: TreeSitterMarkdown
      - package: TreeSitterKotlin
    info:
      path: DiffViewer/Info.plist
      properties:
        CFBundleName: DiffViewer
        CFBundleDisplayName: DiffViewer
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "26.0"
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: ""
        NSHighResolutionCapable: true
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: Folder
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.selwin.DiffViewer
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_EMIT_LOC_STRINGS: NO
    scheme:
      testTargets:
        - DiffViewerTests
  DiffViewerTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: DiffViewerTests
    dependencies:
      - target: DiffViewer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.selwin.DiffViewerTests
        GENERATE_INFOPLIST_FILE: YES
